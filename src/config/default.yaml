data:
  root: "A股数据"
  start_date: "2016-01-04"
  train_end_date: "2025-12-31"
  valid_start_date: "2026-01-01"
  valid_end_date: "2026-05-20"
  universe_mode: "official"
  official_universe_exclude_st: true
  official_universe_exclude_bse: true

label:
  main: "label_5d"
  # main: "label_5d_vol_norm" # 波动率标准化
  # main: "label_5d_cs_rank"  # cross-sectional rank
  horizons: [1, 3, 5]

features:
  lookback_windows: [5, 10, 20, 60]
  use_price: true
  use_metric: true
  use_moneyflow: true
  use_alpha_factors: true
  alpha_windows: [5, 10, 20]
  use_news_finbert: false
  news_finbert_model: "yiyanghkust/finbert-tone-chinese"
  news_finbert_svd_dim: 16
  news_cutoff_time: null
  use_stock_news: false
  stock_news_tfidf_max_features: 256
  stock_news_svd_dim: 16

preprocess:
  winsorize: true
  winsorize_method: "train_quantile"
  lower_quantile: 0.01
  upper_quantile: 0.99
  impute_method: "train_median"
  scale_method: "train_standard"

dataset:
  type: "window"
  lookback: 20
  min_history_days: 20

model:
  name: "mlp"
  task: "regression"
  input_dim: null
  hidden_dim: 128
  dropout: 0.3
  num_layers: 2
  num_heads: 4
  device: "cpu"
  ridge:
    alpha: 10.0
  elasticnet:
    alpha: 0.0001
    l1_ratio: 0.5
    max_iter: 20000
  gbdt:
    learning_rate: 0.03
    n_estimators: 600
    max_iter: 600
    random_state: 42

training:
  seed: 42
  batch_size: 4096
  epochs: 100
  learning_rate: 0.0005
  weight_decay: 0.0001
  loss: "mse"
  early_stopping_patience: 10
  device: "cpu"

backtest:
  initial_cash: 1000000
  execution_price: "open"
  commission_rate: 0.0003
  stamp_tax_rate: 0.001
  slippage_rate: 0.0005
  min_lot_size: 100
  enforce_t_plus_one: true
  block_limit_up_buy: true
  block_limit_down_sell: true
  target_full_invested: true

strategy:
  name: "score_weighted_risk_control"
  benchmark_strategy: "topk_equal_weight"
  top_k: 20
  max_single_weight: 0.10
  max_industry_weight: 0.30
  max_turnover: null
  min_amount: 0

outputs:
  root: "outputs"
