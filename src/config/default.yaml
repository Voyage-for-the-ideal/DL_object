# A-share cross-sectional ranking prediction — default configuration

data:
  root: "A股数据"
  start_date: "2016-01-04"
  train_end_date: "2025-12-31"
  valid_start_date: "2026-01-01"
  valid_end_date: "2026-05-20"
  universe_mode: "official"
  official_universe_exclude_st: true
  official_universe_exclude_bse: true

label:
  main: "label_5d_cs_rank"
  horizons: [5]

features:
  lookback_windows: [5, 10, 20, 60]
  use_price: true
  use_metric: true
  use_moneyflow: true
  use_alpha_factors: true
  alpha_windows: [5, 10, 20]
  use_news_finbert: false
  use_stock_news: false
  use_news_sentiment: false
  news_finbert_model: "yiyanghkust/finbert-tone-chinese"
  news_finbert_svd_dim: 16
  news_cutoff_time: null
  stock_news_tfidf_max_features: 256
  stock_news_svd_dim: 16

preprocess:
  winsorize: true
  winsorize_method: "train_quantile"
  lower_quantile: 0.01
  upper_quantile: 0.99
  impute_method: "train_median"
  scale_method: "train_standard"

dataset:
  type: "tabular"
  lookback: 20
  min_history_days: 20

model:
  name: "ft_transformer"
  task: "regression"
  input_dim: null
  device: "cuda"
  hidden_dim: 128
  dropout: 0.3
  num_layers: 2
  num_heads: 4
  ridge:
    alpha: 10.0
  elasticnet:
    alpha: 0.0001
    l1_ratio: 0.5
    max_iter: 20000
  gbdt:
    learning_rate: 0.05
    n_estimators: 500
    max_depth: 6
    random_state: 42
  ft_transformer:
    d_token: 128
    n_blocks: 4
    n_heads: 8
    ffn_ratio: 2
    dropout: 0.2
    drop_path: 0.1

training:
  seed: 42
  batch_size: 4096
  epochs: 100
  learning_rate: 0.0003
  weight_decay: 0.001
  loss: "huber"
  huber_delta: 1.0
  optimizer: "adamw"
  scheduler: "cosine_restart"
  scheduler_t0: 10
  warmup_epochs: 5
  max_grad_norm: 1.0
  early_stop_metric: "valid_rank_ic"
  early_stopping_patience: 10
  device: "cuda"

ensemble:
  gbdt_weight: 0.50
  ft_transformer_weight: 0.30
  news_weight: 0.20

backtest:
  initial_cash: 1000000
  execution_price: "open"
  commission_rate: 0.0003
  stamp_tax_rate: 0.001
  slippage_rate: 0.0005
  min_lot_size: 100
  enforce_t_plus_one: true
  block_limit_up_buy: true
  block_limit_down_sell: true
  target_full_invested: true

strategy:
  name: "score_weighted_risk_control"
  benchmark_strategy: "topk_equal_weight"
  top_k: 20
  max_single_weight: 0.10
  max_industry_weight: 0.30
  max_turnover: 0.50
  min_amount: 10000000

outputs:
  root: "outputs"
